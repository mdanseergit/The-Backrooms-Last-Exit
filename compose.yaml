services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: last_exit
      POSTGRES_USER: last_exit
      POSTGRES_PASSWORD: last_exit_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U last_exit -d last_exit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  local-proxy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  migrate:
    profiles: ["app"]
    build: .
    command: ["pnpm", "--filter", "@workspace/db", "run", "push"]
    environment:
      DATABASE_URL: postgresql://last_exit:last_exit_local@postgres:5432/last_exit
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    command: ["pnpm", "--filter", "@workspace/api-server", "run", "dev"]
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://last_exit:last_exit_local@postgres:5432/last_exit
      SESSION_SECRET: local-only-secret-for-docker-development-please-change
      WEB_ORIGIN: http://localhost:8081
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build: .
    command: ["pnpm", "--filter", "@workspace/last-exit", "run", "dev"]
    environment:
      PORT: "5173"
      BASE_PATH: /
    depends_on:
      - api

  app-proxy:
    profiles: ["app"]
    image: caddy:2-alpine
    ports:
      - "8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data: