databases:
  - name: last-exit-db
    databaseName: last_exit
    user: last_exit
    plan: free
    region: oregon

services:
  - type: web
    name: last-exit-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    # Schema first, then build, so the new code never runs against an old schema.
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile --ignore-scripts &&
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/api-server run build
    # Run the bundle directly: no pnpm/workspace resolution at boot time.
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: last-exit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # REQUIRED: set this to the Vercel frontend origin, e.g.
      # https://last-exit.vercel.app - without it every browser request is
      # rejected by CORS and the deployed frontend cannot reach the API.
      - key: WEB_ORIGIN
        sync: false
      # Optional: allow Vercel preview deployments. `*` matches one URL
      # segment, so this covers https://<preview>-<project>.vercel.app
      - key: WEB_ORIGIN_PREVIEW
        sync: false
