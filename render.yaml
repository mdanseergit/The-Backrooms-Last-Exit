databases:
  - name: last-exit-db
    databaseName: last_exit
    user: last_exit
    plan: free
    region: oregon

services:
  - type: web
    name: last-exit-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --ignore-scripts &&
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: last-exit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
